name: ECS Checks

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  ecs-structure-checks:
    name: 'ECS checks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop (for official scripts)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch PR branch (code under test)
        run: |
          git fetch origin +refs/pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- .

      - name: Restore test scripts from develop
        run: |
          git checkout develop -- .github/scripts

      - name: Run ECS structure check
        run: python .github/scripts/ecs_check_structure.py

      - name: Run ECS components check
        run: python .github/scripts/ecs_check_components.py

      - name: Run ECS events check
        run: python .github/scripts/ecs_check_events.py

      - name: Run ECS systems check
        run: python .github/scripts/ecs_check_systems.py
