name: GdUnit4 Tests
on:
  push:
    branches:
      - 'develop'
      - 'release-*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.2.1'      
          paths: 'res://tests'         
          timeout: 10                  
          version: 'latest'  