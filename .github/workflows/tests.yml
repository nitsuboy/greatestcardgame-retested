name: GdUnit4 Tests
on:
  pull_request:
    branches:
      - develop


jobs:
  test:
    name: 'Run all tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          publish-report: false
          godot-version: '4.6'      
          paths: 'res://tests'         
          timeout: 10                  
          version: 'latest'  