[plugin]

name="TRUCO"
description="TRUCO is a Godot 4 plugin that provides a reusable multiplayer ECS framework for card games. It handles all the infrastructure, entities, components, network synchronization, turns, input, validation, and choices, leaving developers free to implement only the logic specific to their game."
author="Nicolas C."
version="1.0"
script="truco.gd"
